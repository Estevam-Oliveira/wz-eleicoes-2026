<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudo por município e zona eleitoral · Eleições 2026 | WZ ANALYSIS</title>
<meta name="description" content="Compare candidatos por município e zona eleitoral e veja a relação do voto com escolaridade, idade e renda. Dados do TSE e do IBGE.">
<meta name="robots" content="index,follow"><meta name="theme-color" content="#F5F3EE">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{--bg:#F5F3EE;--surface:#fff;--ink:#1E1E1C;--mut:#6B6A64;--line:#E1DED5;--brand:#00AB96;--brand-d:#01736A;--brand-t:#E4F4F1;--warn:#B25E00;--warn-bg:#FFF3DE;--r:10px;
--f-h:"Montserrat","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--f-b:"Archivo","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--c0:#00AB96;--c1:#E4572E;--c2:#3D5A80;--c3:#B8860B}
:root[data-t=dark]{--bg:#101413;--surface:#181D1C;--ink:#ECEBE6;--mut:#9AA19E;--line:#2A312F;--brand:#19C4AE;--brand-t:#12302C;--warn:#F2B25C;--warn-bg:#2B2212;--c0:#19C4AE;--c1:#FF7A59;--c2:#7FA4D4;--c3:#E3B341}
*{box-sizing:border-box;margin:0}body{font:15px/1.45 var(--f-b);color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-h);letter-spacing:-.01em;line-height:1.15}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:7px;background:#fff}.top b{font:700 15px var(--f-h)}.top small{display:block;color:var(--mut);font-size:12px}
.top .sp{flex:1}.lnk{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.eyebrow{font:600 11px var(--f-h);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.pagehead h1{font-size:28px;margin:4px 0 6px}.pagehead p{color:var(--mut);font-size:14px;max-width:820px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}.card h2 small{font:500 12px var(--f-b);color:var(--mut)}
.note{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:11px 14px;font-size:13.5px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;background:var(--surface);color:var(--mut)}
.pill[aria-pressed=true],.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.pill,input.pill{color:var(--ink)}input.pill{min-width:200px;font-weight:500}
.seg{display:flex;gap:4px;padding:3px;background:var(--line);border-radius:10px;overflow-x:auto;margin:14px 0;scrollbar-width:none}
.seg button{flex:1 0 auto;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mut);white-space:nowrap}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:10px}
.cb{display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--surface)}
.cb i{width:12px;height:12px;border-radius:3px;border:2px solid var(--line);flex:none}.cb[aria-pressed=true]{border-color:var(--ink)}.cb[aria-pressed=true] i{border-color:transparent}
.cb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb small{color:var(--mut);font-size:11.5px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kc{border:1px solid var(--line);border-left:5px solid var(--c0);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.kc b{font:700 14px var(--f-h);display:block}.kc .v{font:800 26px var(--f-h);margin:4px 0}.kc small{color:var(--mut);font-size:12.5px;display:block}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{font:600 11px var(--f-h);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl .n{text-align:right}.tbl td small{color:var(--mut)}
.w{font-weight:700}.mini{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px;min-width:70px}.mini i{display:block;height:100%}
.more{display:block;width:100%;padding:11px;margin-top:10px;border:1px solid var(--line);border-radius:10px;font-weight:600;color:var(--brand-d)}
:root[data-t=dark] .more{color:var(--brand)}
.flag{display:inline-block;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);margin-left:6px}
.grp{display:grid;gap:10px}.gb{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}.gb .lb{font-size:12.5px;color:var(--mut)}.gb .bs{display:grid;gap:4px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px}.bar i{display:block;height:14px;border-radius:4px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg.sc{width:100%;height:auto;max-width:760px;display:block}svg.sc text{fill:var(--mut);font-size:11px}
.cols{display:grid;gap:14px}@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.gb{grid-template-columns:190px 1fr}}
.foot{color:var(--mut);font-size:12.5px;margin-top:22px;line-height:1.55}
.ld{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>

async function load(c,u){const key=u?c+'_'+u:c;if(DATA[key])return DATA[key];const r=await fetch('dados/estudo_'+key+'.json?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();

function sortFn(k0,k1){const m={vv:(a,b)=>b.vv-a.vv,a:(a,b)=>(share(b,k0)??-1)-(share(a,k0)??-1),dif:(a,b)=>((share(b,k0)||0)-(share(b,k1)||0))-((share(a,k0)||0)-(share(a,k1)||0)),nome:(a,b)=>a.mun.localeCompare(b.mun,'pt')};return m[S.sort]||m.vv}
function vTabela(zs,nivel){

/* estatistica */
function wstats(U,xf,k){const P=U.map(u=>({x:xf(u),y:share(u,k),w:u.vv})).filter(p=>p.x!=null&&p.y!=null&&p.w>0&&isFinite(p.x));
  const W=P.reduce((a,p)=>a+p.w,0);if(P.length<10)return {n:P.length};
  const mx=P.reduce((a,p)=>a+p.w*p.x,0)/W,my=P.reduce((a,p)=>a+p.w*p.y,0)/W;
  let sxx=0,syy=0,sxy=0;P.forEach(p=>{sxx+=p.w*(p.x-mx)**2;syy+=p.w*(p.y-my)**2;sxy+=p.w*(p.x-mx)*(p.y-my)});
  const r=sxy/Math.sqrt(sxx*syy),b=sxy/sxx;return {n:P.length,r,b,a:my-b*mx,P,mx,my}}
function faixas(U,xf,n=5){const A=U.map(u=>({u,x:xf(u)})).filter(a=>a.x!=null&&isFinite(a.x)&&a.u.vv>0).sort((a,b)=>a.x-b.x);
  const W=A.reduce((s,a)=>s+a.u.vv,0);let c=0;const B=Array.from({length:n},()=>({xmin:Infinity,xmax:-Infinity,vv:0,v:{},n:0}));
  A.forEach(a=>{const i=Math.min(n-1,Math.floor((c+a.u.vv/2)/W*n));c+=a.u.vv;const b=B[i];b.n++;b.vv+=a.u.vv;b.xmin=Math.min(b.xmin,a.x);b.xmax=Math.max(b.xmax,a.x);for(const k in a.u.v)b.v[k]=(b.v[k]||0)+a.u.v[k]});return B}
const lcF=t=>t.charAt(0).toLowerCase()+t.slice(1);
const forca=r=>{const a=Math.abs(r);return a<.2?'muito fraca':a<.4?'fraca':a<.6?'moderada':a<.8?'forte':'muito forte'};
function scatter(st,xt,yt,cor,fx){if(!st.P)return '';const W=620,H=360,L=48,Bm=34,T=10,R=10;
  const xs=st.P.map(p=>p.x),mn=Math.min(...xs),mxv=Math.max(...xs),sx=x=>L+(x-mn)/((mxv-mn)||1)*(W-L-R),sy=y=>H-Bm-(y/100)*(H-Bm-T);
  const dots=st.P.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${Math.max(1.6,Math.min(6,Math.sqrt(p.w)/60)).toFixed(1)}" fill="${cor}" fill-opacity=".35"/>`).join('');
  const y0=Math.max(0,Math.min(100,st.a+st.b*mn)),y1=Math.max(0,Math.min(100,st.a+st.b*mxv));
  const gy=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${v}%</text>`).join('');
  const gx=[0,.25,.5,.75,1].map(f=>{const v=mn+f*(mxv-mn);return `<text x="${sx(v)}" y="${H-Bm+16}" text-anchor="middle">${fx(v)}</text>`}).join('');
  return `<svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dispersão: ${esc(xt)} e ${esc(yt)}">${gy}${gx}${dots}<line x1="${sx(mn)}" y1="${sy(y0)}" x2="${sx(mxv)}" y2="${sy(y1)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/><text x="${(L+W-R)/2}" y="${H-2}" text-anchor="middle">${esc(xt)}</text><text x="12" y="${T+8}" transform="rotate(-90 12 ${T+8})" text-anchor="end" style="display:none">${esc(yt)}</text></svg>`}
function vPerfil(zs){
